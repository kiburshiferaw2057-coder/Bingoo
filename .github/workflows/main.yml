name: Prepare Capacitor Android project if needed
        run: |
          mkdir -p android-twa-capacitor/www
          cp index.html styles.css app.js manifest.json sw.js android-twa-capacitor/www/
          if [ -d "assets" ]; then
            cp -r assets android-twa-capacitor/www/
          fi

          cd android-twa-capacitor
          npm install @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          cd android
          ./gradlew assembleDebug bundleRelease
