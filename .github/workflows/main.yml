name: Build and Release BINGO ET APK & AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Verify BINGO ET web files
        run: test -f index.html && test -f styles.css && test -f app.js && test -f manifest.json && test -f sw.js

      - name: Prepare Capacitor Android project if needed
        run: |
          cd android-twa-capacitor
          npm install @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          cd android
          ./gradlew assembleDebug bundleRelease
